name: GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - packages/pi/package.json

  workflow_dispatch:
permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Build and publish the Pi bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updated package version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

          fetch-depth: 0
      - name: Setup Bun and install
        uses: ./.github/actions/setup

      - name: Build extension artifact
        run: bun run pack

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          version="$(node -p "require('./packages/pi/package.json').version")"
          if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            before_version="$(git show "${BEFORE_SHA}:packages/pi/package.json" | node -e 'console.log(JSON.parse(require("node:fs").readFileSync(0, "utf8")).version)')"
            if [[ "$before_version" == "$version" ]]; then
              echo "Package manifest changed without a version bump; nothing to release."
              exit 0
            fi
          fi
          tag="pi-lossless-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" --title "$tag" --generate-notes packages/pi/dist/index.mjs
